<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E1C18">
<title>Tally Notepad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="totals">
    <div class="metric">
      <div class="label">Calories</div>
      <div class="value" id="calTotal">0</div>
    </div>
    <div class="metric">
      <div class="label">Protein</div>
      <div class="value" id="proTotal">0<span class="unit">g</span></div>
    </div>
    <div class="totals-right">
      <div class="count" id="lineCount">0 entries</div>
      <div class="actions">
        <button id="historyBtn" class="link-btn" type="button">History</button>
        <button id="newDayBtn" class="link-btn" type="button">Start New Day</button>
      </div>
    </div>
  </div>
  <div class="hint">One entry per line — calories, protein, note (commas or spaces both work).</div>
  <textarea id="pad" placeholder="100, 10&#10;200, 20&#10;300, 30 chicken breast" spellcheck="false"></textarea>
</div>
<div class="status" id="status">saved</div>

<div id="historyOverlay" class="history-overlay"></div>
<aside id="historyDrawer" class="history-drawer" aria-hidden="true">
  <div class="drawer-header">
    <h2>History</h2>
    <button id="drawerClose" class="link-btn" type="button">Close</button>
  </div>
  <div class="drawer-body">
    <div id="drawerList"></div>
    <div id="drawerDetail" hidden>
      <button id="drawerBack" class="drawer-back" type="button">&larr; All days</button>
      <div class="day-date" id="drawerDetailDate"></div>
      <div class="day-totals" id="drawerDetailTotals"></div>
      <pre class="raw-text" id="drawerDetailText"></pre>
    </div>
  </div>
</aside>

<script src="storage.js"></script>
<script src="app.js"></script>
<script src="history.js"></script>
</body>
</html>
